name: Check VLESS Subscriptions

on:
  schedule:
    - cron: '0 */6 * * *'  # Каждые 6 часов
  workflow_dispatch:      # Возможность запустить вручную кнопкой
  push:
    branches: [ main ]
    paths: [ 'sub.txt' ]  # Запуск при изменении списка подписок

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: pip install requests
        
    - name: Run checker
      run: python checker.py
      
    - name: Upload results as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vless-results
        path: output/
        retention-days: 5  # Хранить архив 5 дней
